apiVersion: apps/v1
kind: Deployment
metadata:
  name: vwapp
  labels:
    app: vwapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vwapp
  template:
    metadata:
      labels:
        app: vwapp
    spec:
      containers:
      - name: vwapp
        image: vaultwarden/server:testing-alpine
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_PASSWORD
        - name: DATABASE_URL
          value: "mysql://$(DB_USER):$(DB_PASSWORD)@vwdb-service:3306/vaultwarden"
        volumeMounts:
        - name: vwapp-data
          mountPath: /data
      volumes:
      - name: vwapp-data
        persistentVolumeClaim:
          claimName: vwapp-pvc