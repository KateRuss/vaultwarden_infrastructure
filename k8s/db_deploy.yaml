apiVersion: apps/v1
kind: Deployment
metadata:
  name: vw-db
  labels:
    app: vw-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vw-db
  template:
    metadata:
      labels:
        app: vw-db
    spec:
      containers:
      - name: vw-db
        image: mariadb:latest
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: "vaultwarden"
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc