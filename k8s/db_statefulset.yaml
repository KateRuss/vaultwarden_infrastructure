apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vw-db
  labels:
    app: vw-db
spec:
  serviceName: vw-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: vw-db
  template:
    metadata:
      labels:
        app: vw-db
    spec:
      containers:
      - name: vw-db
        image: mariadb:13.0.1-rc
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - "mariadb -u$MYSQL_USER -p$MYSQL_PASSWORD -e 'SELECT 1'"
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - bash
            - -c
            - "mysqladmin ping -u$MYSQL_USER -p$MYSQL_PASSWORD"
          initialDelaySeconds: 180
          periodSeconds: 60
          failureThreshold: 10
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: "vaultwarden"
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi