apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vw-db
  labels:
    app: vw-db
spec:
  securityContext:
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  serviceName: vw-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: vw-db
  template:
    metadata:
      labels:
        app: vw-db
    spec:
      containers:
      - name: vw-db
        image: mariadb:13.0.1-rc
        imagePullPolicy: Always
      readinessProbe:
        httpGet:
          path: /alive
          port: 3306
        initialDelaySeconds: 10
        periodSeconds: 5
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
        ports:
        - containerPort: 3306
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: "vaultwarden"
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi